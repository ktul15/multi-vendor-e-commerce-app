name: Deployment smoke test

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Deployed GitHub environment to verify
        required: true
        type: choice
        options: [staging, production]
      release_sha:
        description: Immutable deployed commit SHA
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: deployment-smoke-${{ inputs.environment }}
  cancel-in-progress: false

jobs:
  smoke:
    name: Verify ${{ inputs.environment }} deployment
    runs-on: ubuntu-latest
    environment:
      name: ${{ inputs.environment }}

    steps:
      - name: Checkout deployed release
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.release_sha }}

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc

      - name: Verify health, identity, and credentialed CORS
        env:
          ADMIN_DASHBOARD_ORIGIN: ${{ vars.ADMIN_DASHBOARD_ORIGIN }}
          BACKEND_ORIGIN: ${{ vars.BACKEND_ORIGIN }}
          EXPECTED_ENVIRONMENT: ${{ inputs.environment }}
          EXPECTED_RELEASE_SHA: ${{ inputs.release_sha }}
          VENDOR_DASHBOARD_ORIGIN: ${{ vars.VENDOR_DASHBOARD_ORIGIN }}
        run: npm run deployment:smoke
